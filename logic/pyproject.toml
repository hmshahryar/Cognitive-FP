[project]
name = "cognitive-mesh"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hafiz Muhammad Shahryar", email = "hafizshahryarshari999@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "clerk-backend-api>=7.1.0",
    "composio>=0.32.0",
    "composio-langchain>=0.32.0",
    "deepagents>=0.7.38",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-google-genai>=4.5.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
cognitive-mesh = "cognitive_mesh:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::SyntaxWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
